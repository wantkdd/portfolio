    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1380" cy="860" r="280" fill="#ffffff" opacity="0.45"/>
  <circle cx="160" cy="120" r="200" fill="#ffffff" opacity="0.45"/>

  <!-- 로고 마크: 달력 타일 + 확인 표시 + 말풍선 -->
  <g transform="translate(240 250)" filter="url(#s)">

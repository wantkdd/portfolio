      <rect x="330" y="210" width="50" height="56" rx="12"/>
      <rect x="60" y="290" width="70" height="56" rx="12"/>
      <rect x="150" y="290" width="70" height="56" rx="12"/>
      <rect x="60" y="370" width="70" height="56" rx="12"/>
    </g>
    <rect x="240" y="290" width="140" height="136" rx="20" fill="#fff"/>
    <path d="M275 358L303 386L350 336" fill="none" stroke="#1f6f55" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

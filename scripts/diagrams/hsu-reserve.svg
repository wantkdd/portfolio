    <rect x="0" y="40" width="440" height="120" rx="70" fill="#1f6f55"/>
    <rect x="0" y="110" width="440" height="50" fill="#1f6f55"/>
    <rect x="100" y="0" width="34" height="100" rx="17" fill="#173f33"/>
    <rect x="306" y="0" width="34" height="100" rx="17" fill="#173f33"/>
    <g fill="#ffffff" opacity="0.28">
